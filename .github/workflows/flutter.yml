name: Flutter checks and Android test build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter create --platforms=android --project-name batipro_dz .
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Build installable release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: BatiPro-DZ-Android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish direct APK download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.1-test
          name: BatiPro DZ – نسخة تثبيت جديدة
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
