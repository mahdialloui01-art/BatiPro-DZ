name: Flutter checks and Android test build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter create --platforms=android --project-name batipro_dz .
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Build universal release APK
        run: flutter build apk --release --build-name=0.1.${{ github.run_number }} --build-number=${{ github.run_number }}
      - name: Verify APK integrity, signature and device compatibility
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          echo "=== APK file ==="
          ls -lh "$APK"
          sha256sum "$APK"
          echo "=== ZIP integrity ==="
          unzip -t "$APK" | tail -n 2
          echo "=== Android package metadata ==="
          "$TOOLS_DIR/aapt" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|native-code:)"
          echo "=== APK signature verification ==="
          "$TOOLS_DIR/apksigner" verify --verbose --print-certs "$APK"
      - name: Test installation on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: adb wait-for-device && adb shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 2; done' && adb install build/app/outputs/flutter-apk/app-release.apk && adb shell am force-stop com.example.batipro_dz && adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -p com.example.batipro_dz && sleep 5 && adb shell pidof com.example.batipro_dz
      - uses: actions/upload-artifact@v4
        with:
          name: BatiPro-DZ-Android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish direct APK download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}-install-verified
          name: BatiPro DZ – فحص تثبيت Android (${{ github.run_number }})
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
