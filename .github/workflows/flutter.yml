name: Flutter checks and Android test build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter create --platforms=android --project-name batipro_dz .
      - name: Ensure Android launcher activity is declared
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="BatiPro DZ"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>
              <uses-permission android:name="android.permission.INTERNET" />
          </manifest>
          EOF
          grep -q 'android.intent.action.MAIN' android/app/src/main/AndroidManifest.xml
          grep -q 'android.intent.category.LAUNCHER' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Build universal release APK
        run: flutter build apk --release --build-name=0.1.${{ github.run_number }} --build-number=${{ github.run_number }}
      - name: Verify APK integrity, signature and device compatibility
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          echo "=== APK file ==="
          ls -lh "$APK"
          sha256sum "$APK"
          echo "=== ZIP integrity ==="
          unzip -t "$APK" | tail -n 2
          echo "=== Android package metadata ==="
          BADGING="$("$TOOLS_DIR/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -E "^(package:|launchable-activity:|sdkVersion:|targetSdkVersion:|native-code:)"
          echo "$BADGING" | grep -q "^package: name='com.example.batipro_dz'"
          echo "$BADGING" | grep -q "^launchable-activity: name='com.example.batipro_dz.MainActivity'"
          echo "=== APK signature verification ==="
          "$TOOLS_DIR/apksigner" verify --verbose --print-certs "$APK"
      - name: Test installation on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          script: |
            set -eu
            adb wait-for-device
            boot_wait=0
            until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\\r')" = "1" ]; do
              sleep 3
              boot_wait=$((boot_wait + 3))
              if [ "$boot_wait" -ge 600 ]; then
                echo "ERROR: Android emulator did not finish booting within 600 seconds"
                adb devices -l || true
                exit 1
              fi
            done
            echo "Emulator boot completed; installing APK"
            install_ok=0
            for attempt in 1 2 3; do
              if adb install -r build/app/outputs/flutter-apk/app-release.apk; then install_ok=1; break; fi
              echo "ADB install attempt $attempt failed; restarting ADB connection"
              adb reconnect || true
              sleep 5
            done
            [ "$install_ok" = "1" ] || { echo "ERROR: APK installation failed after 3 attempts"; exit 1; }
            adb shell am force-stop com.example.batipro_dz
            adb shell am start -W -n com.example.batipro_dz/.MainActivity
            app_wait=0
            app_pid=""
            until [ -n "$app_pid" ]; do
              app_pid="$(adb shell pidof com.example.batipro_dz 2>/dev/null | tr -d '\\r' || true)"
              sleep 2
              app_wait=$((app_wait + 2))
              if [ "$app_wait" -ge 30 ]; then
                echo "ERROR: BatiPro DZ process did not remain alive after launch"
                adb logcat -d -t 300 || true
                exit 1
              fi
            done
            echo "PASS: BatiPro DZ launched successfully; PID=$app_pid"
      - uses: actions/upload-artifact@v4
        with:
          name: BatiPro-DZ-Android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish direct APK download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}-install-verified
          name: BatiPro DZ – فحص تثبيت Android (${{ github.run_number }})
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
