name: BatiPro DZ Android APK

on:
  push:
    branches: [main, feature/postgresql-backend-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter create --platforms=android --project-name batipro_dz .
      - name: Ensure Android launcher activity is declared
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="BatiPro DZ"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>
              <uses-permission android:name="android.permission.INTERNET" />
          </manifest>
          EOF
          grep -q 'android.intent.action.MAIN' android/app/src/main/AndroidManifest.xml
          grep -q 'android.intent.category.LAUNCHER' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Build universal release APK
        run: flutter build apk --release --build-name=0.1.${{ github.run_number }} --build-number=${{ github.run_number }}
      - name: Verify APK integrity, signature and device compatibility
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          echo "=== APK file ==="
          ls -lh "$APK"
          sha256sum "$APK"
          echo "=== ZIP integrity ==="
          unzip -t "$APK" | tail -n 2
          echo "=== Android package metadata ==="
          BADGING="$("$TOOLS_DIR/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -E "^(package:|launchable-activity:|sdkVersion:|targetSdkVersion:|native-code:)"
          echo "$BADGING" | grep -q "^package: name='com.example.batipro_dz'"
          echo "$BADGING" | grep -q "^launchable-activity: name='com.example.batipro_dz.MainActivity'"
          echo "=== APK signature verification ==="
          "$TOOLS_DIR/apksigner" verify --verbose --print-certs "$APK"
      - name: Test installation on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          # The action executes each script line in a separate shell; keep this as one command.
          script: bash .github/scripts/android-emulator-smoke-test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BatiPro-DZ-Android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish direct APK download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}-install-verified
          name: BatiPro DZ – فحص تثبيت Android (${{ github.run_number }})
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
