name: BatiPro DZ Windows build

on:
  push:
    branches: [main, feature/postgresql-backend-foundation, feature/android-seller-account]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows desktop runner
        run: flutter create --platforms=windows --project-name batipro_dz .
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos
      - name: Run tests
        run: flutter test
      - name: Build Windows release
        run: flutter build windows --release --build-name=0.1.${{ github.run_number }} --build-number=${{ github.run_number }}
      - name: Verify and smoke-test Windows executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'build/windows/x64/runner/Release/batipro_dz.exe'
          if (!(Test-Path $exe)) { throw "Windows executable not found: $exe" }
          $releaseDir = Split-Path $exe
          $required = @('flutter_windows.dll', 'data/icudtl.dat', 'data/flutter_assets')
          foreach ($item in $required) {
            if (!(Test-Path (Join-Path $releaseDir $item))) { throw "Missing runtime component: $item" }
          }
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) { throw "BatiPro DZ exited during startup smoke test (code $($process.ExitCode))" }
          Stop-Process -Id $process.Id -Force
          Write-Host 'Windows executable startup smoke test passed.'
      - name: Package Windows application
        shell: pwsh
        run: |
          $source = Join-Path $PWD 'build/windows/x64/runner/Release'
          $destination = Join-Path $PWD 'BatiPro-DZ-Windows.zip'
          Compress-Archive -Path (Join-Path $source '*') -DestinationPath $destination -CompressionLevel Optimal
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: BatiPro-DZ-Windows-release
          path: BatiPro-DZ-Windows.zip
          if-no-files-found: error
          retention-days: 14
      - name: Publish Windows download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}-windows
          name: BatiPro DZ - Windows (${{ github.run_number }})
          generate_release_notes: true
          files: BatiPro-DZ-Windows.zip
