services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-batipro}
      POSTGRES_USER: ${POSTGRES_USER:-batipro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - batipro_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-batipro} -d ${POSTGRES_DB:-batipro}"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-batipro}
      PGUSER: ${POSTGRES_USER:-batipro}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - batipro_postgres_backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      while true; do
        file="/backups/batipro-$$(date -u +%Y%m%dT%H%M%SZ).dump";
        if pg_dump -Fc -f "${file}"; then
          find /backups -type f -name 'batipro-*.dump' -mtime +7 -delete;
        else
          rm -f "$$file";
        fi;
        sleep 86400;
      done

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-batipro}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-batipro}
      BATIPRO_TOKEN_SECRET: ${BATIPRO_TOKEN_SECRET:?Set BATIPRO_TOKEN_SECRET in .env}
      BATIPRO_BOOTSTRAP_SECRET: ${BATIPRO_BOOTSTRAP_SECRET:?Set BATIPRO_BOOTSTRAP_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  batipro_postgres_data:
  batipro_postgres_backups:
